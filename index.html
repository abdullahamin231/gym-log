<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Gym Log</title>
</head>
<body class="app">
  <header class="app-header">
    <div class="app-title">
      <div class="app-name">IRON</div>
      <div id="headerSubtitle" class="app-subtitle">Session</div>
    </div>
    <button id="installBtn" class="btn ghost" type="button" style="display:none">Install</button>
  </header>

  <nav class="tabbar" aria-label="Primary navigation">
    <button class="tab" data-nav="programs" type="button">Program</button>
    <button class="tab active" data-nav="session" type="button">Session</button>
    <button class="tab" data-nav="history" type="button">History</button>
    <button class="tab" data-nav="track-weight" type="button">Weight</button>
  </nav>

  <main class="app-main">
    <!-- Programs (read-only reference) -->
    <section class="screen hidden" id="screen-programs" data-screen="programs">
      <div class="card">
        <div id="hardcodedProgramSheet" class="program-sheet" aria-label="Program reference"></div>
      </div>
    </section>

    <!-- Session (HOME) -->
    <section class="screen" id="screen-session" data-screen="session">
      <div id="sessionPreview" class="session-preview">
        <div class="session-preview-header">
          <span class="session-preview-label">Today</span>
          <span id="sessionPreviewProgram" class="session-preview-program"></span>
          <h2 id="sessionPreviewDay" class="session-preview-day">—</h2>
          <span id="sessionPreviewExerciseCount" class="session-preview-count"></span>
        </div>
        <ul id="sessionPreviewExercises" class="session-preview-list"></ul>
        <div class="session-preview-daypicker">
          <label for="sessionDaySelect">Switch day</label>
          <select id="sessionDaySelect"></select>
        </div>
        <button id="sessionStartBtn" class="btn btn-primary btn-block" type="button">Start Session</button>
      </div>

      <!-- Active session -->
      <div class="card" id="sessionRunCard">
        <div class="section-head">
          <h2>Session</h2>
          <button id="completeSessionBtn" class="btn ghost danger" type="button">Complete</button>
        </div>
        <div id="sessionStatus" class="status">No active session.</div>
        <div id="sessionControls" class="current hidden">
          <div class="session-status-bar">
            <span id="setProgress" class="muted"></span>
          </div>
          <div class="exercise-head">
            <button id="prevExerciseBtn" class="btn ghost" type="button" aria-label="Previous exercise">&#8592;</button>
            <div class="label" id="sessionExerciseLabel">Current</div>
            <button id="nextExerciseBtn" class="btn ghost" type="button" aria-label="Next exercise">&#8594;</button>
          </div>
          <div id="currentExercise"></div>
          <div class="row" style="justify-content:center">
            <button id="removeSetBtn" class="btn ghost" type="button">&minus; Set</button>
            <button id="addSetBtn" class="btn ghost" type="button">+ Set</button>
          </div>
        </div>
        <div id="setsGrid" class="sets-grid" aria-label="Sets grid"></div>
      </div>
    </section>

    <!-- History -->
    <section class="screen hidden" id="screen-history" data-screen="history">
      <div class="card">
        <div class="section-head">
          <h2>History</h2>
          <button id="clearHistoryBtn" class="btn ghost danger" type="button">Clear All</button>
        </div>
        <div class="history-chart">
          <label>
            Exercise progress
            <select id="historyExerciseSelect"></select>
          </label>
          <div id="historyChartEmpty" class="muted"></div>
          <canvas id="historyChart" class="chart" width="600" height="280" aria-label="Exercise progress chart"></canvas>
        </div>
        <div class="divider"></div>
        <div class="section-head">
          <h3>Backup</h3>
          <div class="row">
            <button id="exportBtn" class="btn ghost" type="button">Download</button>
            <button id="importBtn" class="btn ghost" type="button">Upload</button>
            <input id="importFile" type="file" accept="application/json" class="hidden">
          </div>
        </div>
        <ul id="historyList" class="list history"></ul>
      </div>
    </section>

    <!-- Track Weight -->
    <section class="screen hidden" id="screen-track-weight" data-screen="track-weight">
      <div class="card">
        <div class="section-head">
          <h2>Track Weight</h2>
        </div>
        <div class="weight-input-row">
          <input type="number" id="weightInput" step="0.1" min="0" inputmode="decimal" placeholder="Weight (kg)">
          <button id="logWeightBtn" class="btn btn-primary" type="button">Log</button>
        </div>
        <div id="weightLogStatus" class="muted" style="text-align:center"></div>
        <div class="weight-chart">
          <canvas id="weightChart" class="chart" width="600" height="280" aria-label="Body weight chart"></canvas>
        </div>
      </div>
    </section>
  </main>

  <template id="historyTemplate">
    <li class="history-item">
      <div class="history-head">
        <div class="history-meta"></div>
        <button class="btn ghost danger" type="button" data-action="delete-history">Remove</button>
      </div>
      <div class="history-exercises"></div>
    </li>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
